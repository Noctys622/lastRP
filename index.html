const data=JSON.parse("{\n\"general\":{\"label\":\"Général\",\"icon\":\"📋\",\"desc\":\"Les règles communes à tous les joueurs de Last RP.\",\"items\":[\n[\"⚖️\",\"Cadre général & bon sens\",\"Le bon sens, la cohérence et le fair-play priment sur toute situation.\"],\n[\"🤝\",\"Respect & comportement\",\"Respect obligatoire ; harcèlement, discrimination, menaces réelles et toxicité HRP interdits.\"],\n[\"🪪\",\"Identité du personnage\",\"Nom et prénom cohérents obligatoires ; pseudos trolls et changement d'identité pour fuir les conséquences interdits.\"],\n[\"💬\",\"Vocal & communication\",\"Pas de spam micro, soundboard abusif ou discussion HRP pendant une scène.\"],\n[\"🧠\",\"Metagaming\",\"Toute information obtenue via Discord, stream, partage d'écran ou source HRP est interdite en RP.\"],\n[\"💪\",\"Powergaming\",\"Les actions irréalistes, impossibles ou imposées sans possibilité de réaction sont interdites.\"],\n[\"😨\",\"Fear RP\",\"Ton personnage doit craindre pour sa vie face à une menace crédible.\"],\n[\"🩹\",\"Pain RP\",\"Les blessures et accidents doivent être joués avec leurs conséquences.\"],\n[\"🌍\",\"Mass RP\",\"Le monde est considéré comme vivant avec témoins, caméras et présence environnante.\"],\n[\"🔪\",\"RDM / Freehit\",\"Tuer ou frapper sans justification RP est interdit.\"],\n[\"🚗\",\"VDM / Carkill\",\"Le véhicule n'est pas une arme ; percuter volontairement sans raison est interdit.\"],\n[\"🚪\",\"Combat Log\",\"Se déconnecter pour éviter une arrestation, un combat ou les conséquences d'une scène est interdit.\"],\n[\"🧠\",\"NLR & mémoire\",\"Pas de vengeance immédiate après coma/mort ; respecte les pertes de mémoire prévues.\"],\n[\"🏥\",\"Coma & réanimation\",\"Un inconscient ne parle pas normalement ; après réanimation, joue tes blessures.\"],\n[\"☠️\",\"Mort RP\",\"Une Mort RP définitive doit être sérieuse, construite et conforme aux procédures du serveur.\"],\n[\"🚘\",\"Conduite RP\",\"Pas de conduite arcade permanente, sauts absurdes ou off-road irréaliste.\"],\n[\"🗺️\",\"Zones sensibles\",\"Spawnkill, camping abusif et farm PvP dans les zones protégées sont interdits.\"],\n[\"🐞\",\"Usebug & exploits\",\"Glitch, duplication, faille d'inventaire et exploitation volontaire d'un bug sont interdits.\"],\n[\"🛡️\",\"Cheat & logiciels tiers\",\"Aimbot, ESP, injecteur, menu et toute modification donnant un avantage sont interdits.\"],\n[\"👥\",\"Multi-compte\",\"Pas de compte secondaire pour contourner une sanction ou transférer abusivement des biens.\"],\n[\"📹\",\"Streams & contenus\",\"Streamhack interdit ; les clips peuvent servir de preuves staff.\"],\n[\"🛠️\",\"Staff & reports\",\"Report après la scène si possible ; mensonge, falsification ou fausse preuve aggravent la sanction.\"]\n]},\n\"legal\":{\"label\":\"Légal\",\"icon\":\"⚖️\",\"desc\":\"Entreprises, métiers, services publics et institutions.\",\"items\":[\n[\"🏢\",\"Création d'entreprise\",\"Une entreprise doit apporter une activité RP réelle, utile et cohérente avec l'univers.\"],\n[\"👔\",\"Patron & direction\",\"Le patron doit rester actif, gérer sa structure et éviter les abus d'autorité.\"],\n[\"👥\",\"Effectifs & recrutement\",\"Pas de recrutement massif inutile ; chaque poste doit avoir une vraie utilité.\"],\n[\"💵\",\"Salaires & primes\",\"Les salaires et primes doivent rester cohérents avec l'économie et l'activité réelle.\"],\n[\"📊\",\"Comptabilité & finances\",\"Les grosses transactions et mouvements financiers doivent avoir une justification RP.\"],\n[\"🔄\",\"Double-job / multi-job\",\"Les cumuls d'emplois incompatibles ou incohérents peuvent être interdits.\"],\n[\"🚔\",\"Fear Police\",\"Copbait interdit ; la police doit représenter une autorité crédible.\"],\n[\"🚨\",\"Escalade de la force\",\"Communication avant force lorsque possible ; la réponse doit rester proportionnée.\"],\n[\"🔗\",\"Arrestations & fouilles\",\"Les arrestations, menottages et fouilles doivent respecter les procédures RP.\"],\n[\"🕵️\",\"Enquêtes & preuves\",\"Les enquêtes reposent sur des éléments obtenus en jeu, jamais sur des informations HRP.\"],\n[\"💼\",\"Corruption\",\"La corruption doit être construite et peut nécessiter une validation staff.\"],\n[\"🩺\",\"EMS & secours\",\"Les EMS ne sont pas des cibles gratuites ; les scènes médicales doivent être respectées.\"],\n[\"⚖️\",\"Justice & avocats\",\"Les audiences et procédures judiciaires doivent rester sérieuses et basées sur des éléments RP.\"],\n[\"🏛️\",\"Gouvernement & institutions\",\"Les décisions majeures doivent rester cohérentes avec le lore et avoir des conséquences RP.\"],\n[\"📰\",\"Médias & informations\",\"Pas d'informations HRP ; les accusations graves doivent disposer d'une base RP.\"]\n]},\n\"illegal\":{\"label\":\"Illégal\",\"icon\":\"🔥\",\"desc\":\"Gangs, organisations, braquages, drogues et conflits.\",\"items\":[\n[\"🎯\",\"Motivation criminelle\",\"Toute action criminelle doit avoir un objectif RP : argent, territoire, vengeance, contrat ou survie.\"],\n[\"👥\",\"Gangs & organisations\",\"Chaque groupe doit avoir une identité, une hiérarchie et des objectifs cohérents.\"],\n[\"🗺️\",\"Territoires\",\"Un territoire se construit RP ; les civils ne sont pas des cibles gratuites.\"],\n[\"⚔️\",\"Guerres de groupes\",\"Une guerre exige une escalade sérieuse ; une petite provocation ne suffit pas.\"],\n[\"🔫\",\"Gunfights\",\"Une fusillade doit être justifiée, pas devenir la réponse automatique à chaque conflit.\"],\n[\"🩸\",\"Gestion des blessés\",\"Les blessés et corps font partie de la scène ; pas de retour immédiat au combat.\"],\n[\"🏦\",\"Braquages\",\"Les braquages doivent être préparés, crédibles et laisser une vraie place à la négociation.\"],\n[\"🎭\",\"Otages\",\"Faux otages interdits ; l'exécution doit rester exceptionnelle et fortement justifiée.\"],\n[\"🗣️\",\"Négociation\",\"Les demandes doivent être réalisables ; rompre la négociation doit avoir une raison RP.\"],\n[\"💰\",\"Loot & dépouillement\",\"Free loot interdit ; ne vide pas systématiquement un inventaire sans raison.\"],\n[\"🚘\",\"Vols de véhicules\",\"Le vol doit s'inscrire dans une scène ; pas de vol gratuit en boucle.\"],\n[\"💊\",\"Drogues\",\"Production et vente doivent créer du RP ; pas de farming mécanique sans interaction.\"],\n[\"🔫\",\"Armes\",\"Le niveau d'armement doit correspondre au niveau de menace et au contexte.\"],\n[\"🪤\",\"Embuscades\",\"Une embuscade doit être construite et laisser une possibilité de réaction.\"],\n[\"🚓\",\"Interactions police\",\"Copbait interdit ; une arrestation ratée ne justifie pas une guerre contre toute la police.\"],\n[\"🩺\",\"Interactions EMS\",\"Pas d'agression gratuite ; le kidnapping d'un EMS doit être exceptionnel et justifié.\"],\n[\"🚔\",\"Poursuites\",\"Respecte les capacités du véhicule, les accidents et le terrain.\"],\n[\"🧨\",\"Explosifs & gros moyens\",\"Les moyens extrêmes nécessitent un contexte très fort et des conséquences RP.\"],\n[\"🏚️\",\"Planques & caches\",\"Pas de glitch pour cacher des objets ; une planque doit rester découvrable selon le RP.\"],\n[\"⛓️\",\"Kidnapping\",\"Pas d'enlèvement aléatoire ; la victime doit pouvoir jouer la scène.\"]\n]},\n\"apocalypse\":{\"label\":\"Post‑Apo\",\"icon\":\"☣️\",\"desc\":\"Survie, ressources, colonies, contaminations et monde en ruines.\",\"items\":[\n[\"🌆\",\"Cohérence du monde\",\"Le monde est instable, dangereux et appauvri ; les comportements doivent respecter le lore post-apocalyptique.\"],\n[\"🥫\",\"Rareté des ressources\",\"Nourriture, eau, médicaments, carburant et matériel doivent conserver une vraie valeur.\"],\n[\"💧\",\"Eau & nourriture\",\"Les expéditions longues et colonies doivent prévoir leur approvisionnement.\"],\n[\"🩹\",\"Médecine rare\",\"Les soins avancés sont difficiles ; une blessure grave ne disparaît pas instantanément.\"],\n[\"☣️\",\"Zones contaminées\",\"Les zones contaminées exigent les protections prévues et doivent provoquer des conséquences crédibles.\"],\n[\"😷\",\"Masques & protections\",\"Un masque ne rend pas invulnérable ; filtres et équipements ont des limites.\"],\n[\"🧟\",\"Infectés / créatures\",\"Les infectés doivent provoquer du Fear RP ; le bruit et les tirs peuvent attirer davantage de danger.\"],\n[\"🦠\",\"Infection & quarantaine\",\"Les colonies peuvent imposer une quarantaine ; mentir sur une infection peut avoir des conséquences RP.\"],\n[\"🏚️\",\"Exploration & fouille\",\"Les ruines sont dangereuses ; la fouille ne doit pas devenir un simple farming mécanique.\"],\n[\"📦\",\"Pillage des ruines\",\"Les zones déjà pillées ne sont pas infiniment remplies ; respecte la rareté du monde.\"],\n[\"🏕️\",\"Camps & colonies\",\"Les communautés ont besoin de ressources, sécurité, règles internes et organisation.\"],\n[\"🧱\",\"Bases & fortifications\",\"Pas de forteresse instantanée ni de construction exploitant les collisions.\"],\n[\"🪓\",\"Raids de bases\",\"Un raid exige un motif RP ; pillage proportionné et destruction totale pour grief interdite.\"],\n[\"🚧\",\"Barricades & routes\",\"Un barrage doit servir au contrôle, commerce ou sécurité, pas bloquer inutilement tout le serveur.\"],\n[\"⛽\",\"Carburant\",\"Le carburant est stratégique ; les longs trajets et gros stocks doivent avoir des conséquences.\"],\n[\"🚙\",\"Véhicules post-apo\",\"Les véhicules sont rares, fragiles et nécessitent entretien, pièces et temps.\"],\n[\"🔧\",\"Réparations & pièces\",\"Pas de réparation magique ; les pièces rares sont un enjeu économique et RP.\"],\n[\"🔋\",\"Électricité & générateurs\",\"Les générateurs nécessitent carburant et entretien ; l'électricité n'est pas garantie.\"],\n[\"📻\",\"Radio & communications\",\"Les communications longue distance dépendent des moyens disponibles ; les fréquences peuvent être interceptées.\"],\n[\"💱\",\"Troc & économie\",\"La valeur d'un objet dépend de sa rareté et de son utilité ; le troc peut remplacer l'argent.\"],\n[\"🌾\",\"Agriculture & production\",\"Les cultures et productions demandent du temps, des ressources et de la protection.\"],\n[\"🐾\",\"Chasse & nature\",\"La chasse ne doit pas devenir un farming illimité ; les territoires de chasse peuvent créer du RP.\"],\n[\"🚁\",\"Airdrops & convois\",\"Les ressources exceptionnelles doivent créer des scènes, pas seulement du PvP.\"],\n[\"🏥\",\"Zones humanitaires\",\"Refuges et zones de soins ne sont pas des cibles gratuites ; une attaque exige un contexte extrême.\"],\n[\"🪖\",\"Zones militaires\",\"Le matériel militaire doit rester rare ; pas de farming en boucle des installations.\"],\n[\"🌪️\",\"Événements environnementaux\",\"Tempêtes, radiations et autres dangers doivent influencer les déplacements et décisions.\"],\n[\"🔥\",\"Feux & destruction\",\"Pas de destruction gratuite ; incendies et sabotages doivent avoir un motif RP.\"],\n[\"🧭\",\"Expéditions\",\"Quitter les zones sûres représente un risque et nécessite préparation et ressources.\"],\n[\"👥\",\"Factions de survivants\",\"Les factions doivent avoir des objectifs autres que tuer et construire leurs alliances/conflits dans le temps.\"],\n[\"🏴\",\"Bandits & pillards\",\"Être pillard ne donne pas le droit de freekill ; vol et intimidation doivent créer une scène.\"],\n[\"🕊️\",\"Réfugiés & neutres\",\"Marchands, médecins et civils non combattants ne sont pas des cibles gratuites.\"],\n[\"📜\",\"Lore & technologies\",\"Pas de technologie miraculeuse ; les inventions majeures peuvent nécessiter validation.\"],\n[\"🧬\",\"Recherche scientifique\",\"Les découvertes majeures doivent se construire dans le temps et respecter le lore.\"],\n[\"🚨\",\"Alertes & évacuations\",\"Les alertes crédibles doivent être prises au sérieux ; les fausses alertes troll sont interdites.\"],\n[\"🎒\",\"Capacité de transport\",\"Un survivant ne transporte pas une quantité infinie ; les charges lourdes exigent des moyens adaptés.\"],\n[\"🛏️\",\"Repos & sécurité\",\"Un camp n'est pas automatiquement sûr ; la vigilance et les tours de garde peuvent faire partie du RP.\"],\n[\"⚰️\",\"Mort dans l'apocalypse\",\"La mort doit conserver un poids narratif ; deuil et conséquences peuvent enrichir le RP.\"],\n[\"🎮\",\"Survie avant PvP\",\"Le post-apocalyptique n'est pas un deathmatch : commerce, coopération et exploration comptent autant que le combat.\"]\n]}}");let active=new URLSearchParams(location.search).get("cat"),all=false;const home=document.getElementById("home"),detail=document.getElementById("detail"),cards=document.getElementById("cards"),tabs=document.getElementById("tabs"),summary=document.getElementById("summary"),list=document.getElementById("list"),search=document.getElementById("search"),expand=document.getElementById("expand"),empty=document.getElementById("empty");function buildHome(){cards.innerHTML=Object.entries(data).map(([k,c])=>'<a class="card" href="?cat='+k+'"><div class="ico">'+c.icon+'</div><h3>'+c.label+'</h3><p>'+c.desc+'</p><div class="meta"><span>'+c.items.length+' CHAPITRES</span><span class="arrow">→</span></div></a>').join("")}function render(){if(!active||!data[active]){home.style.display="block";detail.style.display="none";buildHome();return}home.style.display="none";detail.style.display="block";const c=data[active];document.getElementById("bigIcon").textContent=c.icon;document.getElementById("title").textContent="Règlement "+c.label;document.getElementById("desc").textContent=c.desc;document.getElementById("count").textContent=c.items.length+" chapitres • Dernière mise à jour : 29 août 2026";tabs.innerHTML=Object.entries(data).map(([k,v])=>'<button class="tab '+(k===active?'active':'')+'" data-cat="'+k+'">'+v.icon+' '+v.label+'</button>').join("");tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{active=b.dataset.cat;history.replaceState(null,"","?cat="+active);search.value="";all=false;render()});filter()}function filter(){const c=data[active],q=search.value.toLowerCase().trim();const items=c.items.filter(x=>!q||[x[1],x[2]].join(" ").toLowerCase().includes(q));summary.innerHTML=items.map((x,i)=>'<a class="sum '+(i===0?'active':'')+'" href="#r'+i+'"><span>'+x[0]+'</span><b>'+x[1]+'</b></a>').join("");list.innerHTML=items.map((x,i)=>'<article class="item '+(all||i===0?'open':'')+'" id="r'+i+'"><div class="head"><span class="ico">'+x[0]+'</span><strong>'+x[1]+'</strong><span class="chev">⌄</span></div><div class="body"><p>'+x[2]+'</p></div></article>').join("");list.querySelectorAll(".head").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));empty.style.display=items.length?"none":"block";expand.textContent=all?"Tout réduire":"Tout déplier"}search.oninput=filter;expand.onclick=()=>{all=!all;filter()};render();
