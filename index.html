const data=JSON.parse("{\"general\":{\"label\":\"Général\",\"icon\":\"📋\",\"desc\":\"Les règles communes à tous les joueurs de Last RP.\",\"items\":[[\"⚖️\",\"Cadre général & bon sens\",\"Le bon sens, la cohérence et le fair-play priment sur toute situation.\"],[\"🤝\",\"Respect & comportement\",\"Respect obligatoire ; harcèlement, discrimination, menaces réelles et toxicité HRP interdits.\"],[\"🪪\",\"Identité du personnage\",\"Nom et prénom cohérents obligatoires ; pseudos trolls et changement d'identité pour fuir les conséquences interdits.\"],[\"💬\",\"Vocal & communication\",\"Pas de spam micro, soundboard abusif ou discussion HRP pendant une scène.\"],[\"🧠\",\"Metagaming\",\"Toute information obtenue via Discord, stream, partage d'écran ou source HRP est interdite en RP.\"],[\"💪\",\"Powergaming\",\"Les actions irréalistes, impossibles ou imposées sans possibilité de réaction sont interdites.\"],[\"😨\",\"Fear RP\",\"Ton personnage doit craindre pour sa vie face à une menace crédible.\"],[\"🩹\",\"Pain RP\",\"Les blessures et accidents doivent être joués avec leurs conséquences.\"],[\"🌍\",\"Mass RP\",\"Le monde est considéré comme vivant avec témoins, caméras et présence environnante.\"],[\"🔪\",\"RDM / Freehit\",\"Tuer ou frapper sans justification RP est interdit.\"],[\"🚗\",\"VDM / Carkill\",\"Le véhicule n'est pas une arme ; percuter volontairement sans raison est interdit.\"],[\"🚪\",\"Combat Log\",\"Se déconnecter pour éviter une arrestation, un combat ou les conséquences d'une scène est interdit.\"],[\"🧠\",\"NLR & mémoire\",\"Pas de vengeance immédiate après coma/mort ; respecte les pertes de mémoire prévues.\"],[\"🏥\",\"Coma & réanimation\",\"Un inconscient ne parle pas normalement ; après réanimation, joue tes blessures.\"],[\"☠️\",\"Mort RP\",\"Une Mort RP définitive doit être sérieuse, construite et conforme aux procédures du serveur.\"],[\"🚘\",\"Conduite RP\",\"Pas de conduite arcade permanente, sauts absurdes ou off-road irréaliste.\"],[\"🗺️\",\"Zones sensibles\",\"Spawnkill, camping abusif et farm PvP dans les zones protégées sont interdits.\"],[\"🐞\",\"Usebug & exploits\",\"Glitch, duplication, faille d'inventaire et exploitation volontaire d'un bug sont interdits.\"],[\"🛡️\",\"Cheat & logiciels tiers\",\"Aimbot, ESP, injecteur, menu et toute modification donnant un avantage sont interdits.\"],[\"👥\",\"Multi-compte\",\"Pas de compte secondaire pour contourner une sanction ou transférer abusivement des biens.\"],[\"📹\",\"Streams & contenus\",\"Streamhack interdit ; les clips peuvent servir de preuves staff.\"],[\"🛠️\",\"Staff & reports\",\"Report après la scène si possible ; mensonge, falsification ou fausse preuve aggravent la sanction.\"]]},\"apocalypse\":{\"label\":\"Post‑Apo\",\"icon\":\"☣️\",\"desc\":\"Survie, ressources, colonies, contaminations et monde en ruines.\",\"items\":[[\"🌆\",\"Cohérence du monde\",\"Le monde est instable, dangereux et appauvri ; les comportements doivent respecter le lore post-apocalyptique.\"],[\"🥫\",\"Rareté des ressources\",\"Nourriture, eau, médicaments, carburant et matériel doivent conserver une vraie valeur.\"],[\"💧\",\"Eau & nourriture\",\"Les expéditions longues et colonies doivent prévoir leur approvisionnement.\"],[\"🩹\",\"Médecine rare\",\"Les soins avancés sont difficiles ; une blessure grave ne disparaît pas instantanément.\"],[\"☣️\",\"Zones contaminées\",\"Les zones contaminées exigent les protections prévues et doivent provoquer des conséquences crédibles.\"],[\"😷\",\"Masques & protections\",\"Un masque ne rend pas invulnérable ; filtres et équipements ont des limites.\"],[\"🧟\",\"Infectés / créatures\",\"Les infectés doivent provoquer du Fear RP ; le bruit et les tirs peuvent attirer davantage de danger.\"],[\"🦠\",\"Infection & quarantaine\",\"Les colonies peuvent imposer une quarantaine ; mentir sur une infection peut avoir des conséquences RP.\"],[\"🏚️\",\"Exploration & fouille\",\"Les ruines sont dangereuses ; la fouille ne doit pas devenir un simple farming mécanique.\"],[\"📦\",\"Pillage des ruines\",\"Les zones déjà pillées ne sont pas infiniment remplies ; respecte la rareté du monde.\"],[\"🏕️\",\"Camps & colonies\",\"Les communautés ont besoin de ressources, sécurité, règles internes et organisation.\"],[\"🧱\",\"Bases & fortifications\",\"Pas de forteresse instantanée ni de construction exploitant les collisions.\"],[\"🪓\",\"Raids de bases\",\"Un raid exige un motif RP ; pillage proportionné et destruction totale pour grief interdite.\"],[\"🚧\",\"Barricades & routes\",\"Un barrage doit servir au contrôle, commerce ou sécurité, pas bloquer inutilement tout le serveur.\"],[\"⛽\",\"Carburant\",\"Le carburant est stratégique ; les longs trajets et gros stocks doivent avoir des conséquences.\"],[\"🚙\",\"Véhicules post-apo\",\"Les véhicules sont rares, fragiles et nécessitent entretien, pièces et temps.\"],[\"🔧\",\"Réparations & pièces\",\"Pas de réparation magique ; les pièces rares sont un enjeu économique et RP.\"],[\"🔋\",\"Électricité & générateurs\",\"Les générateurs nécessitent carburant et entretien ; l'électricité n'est pas garantie.\"],[\"📻\",\"Radio & communications\",\"Les communications longue distance dépendent des moyens disponibles ; les fréquences peuvent être interceptées.\"],[\"💱\",\"Troc & économie\",\"La valeur d'un objet dépend de sa rareté et de son utilité ; le troc peut remplacer l'argent.\"],[\"🌾\",\"Agriculture & production\",\"Les cultures et productions demandent du temps, des ressources et de la protection.\"],[\"🐾\",\"Chasse & nature\",\"La chasse ne doit pas devenir un farming illimité ; les territoires de chasse peuvent créer du RP.\"],[\"🚁\",\"Airdrops & convois\",\"Les ressources exceptionnelles doivent créer des scènes, pas seulement du PvP.\"],[\"🏥\",\"Zones humanitaires\",\"Refuges et zones de soins ne sont pas des cibles gratuites ; une attaque exige un contexte extrême.\"],[\"🪖\",\"Zones militaires\",\"Le matériel militaire doit rester rare ; pas de farming en boucle des installations.\"],[\"🌪️\",\"Événements environnementaux\",\"Tempêtes, radiations et autres dangers doivent influencer les déplacements et décisions.\"],[\"🔥\",\"Feux & destruction\",\"Pas de destruction gratuite ; incendies et sabotages doivent avoir un motif RP.\"],[\"🧭\",\"Expéditions\",\"Quitter les zones sûres représente un risque et nécessite préparation et ressources.\"],[\"👥\",\"Factions de survivants\",\"Les factions doivent avoir des objectifs autres que tuer et construire leurs alliances/conflits dans le temps.\"],[\"🏴\",\"Bandits & pillards\",\"Être pillard ne donne pas le droit de freekill ; vol et intimidation doivent créer une scène.\"],[\"🕊️\",\"Réfugiés & neutres\",\"Marchands, médecins et civils non combattants ne sont pas des cibles gratuites.\"],[\"📜\",\"Lore & technologies\",\"Pas de technologie miraculeuse ; les inventions majeures peuvent nécessiter validation.\"],[\"🧬\",\"Recherche scientifique\",\"Les découvertes majeures doivent se construire dans le temps et respecter le lore.\"],[\"🚨\",\"Alertes & évacuations\",\"Les alertes crédibles doivent être prises au sérieux ; les fausses alertes troll sont interdites.\"],[\"🎒\",\"Capacité de transport\",\"Un survivant ne transporte pas une quantité infinie ; les charges lourdes exigent des moyens adaptés.\"],[\"🛏️\",\"Repos & sécurité\",\"Un camp n'est pas automatiquement sûr ; la vigilance et les tours de garde peuvent faire partie du RP.\"],[\"⚰️\",\"Mort dans l'apocalypse\",\"La mort doit conserver un poids narratif ; deuil et conséquences peuvent enrichir le RP.\"],[\"🎮\",\"Survie avant PvP\",\"Le post-apocalyptique n'est pas un deathmatch : commerce, coopération et exploration comptent autant que le combat.\"]]},\"clan\":{\"label\":\"Clan\",\"icon\":\"🛡️\",\"desc\":\"Création, hiérarchie, territoires, alliances et conflits entre clans.\",\"items\":[[\"🛡️\",\"Création d'un clan\",\"Un clan doit avoir une identité, un nom, une histoire et des objectifs cohérents avec l'univers de Last RP.\"],[\"👑\",\"Chef & hiérarchie\",\"Chaque clan doit disposer d'une hiérarchie claire. Le chef est responsable de l'activité et du comportement global de son groupe.\"],[\"👥\",\"Effectif\",\"L'effectif doit rester raisonnable et actif. Les recrutements uniquement pour obtenir un avantage numérique sont interdits.\"],[\"📜\",\"Identité & lore\",\"Tenues, symboles, comportement et valeurs doivent correspondre à l'histoire du clan et rester cohérents dans le temps.\"],[\"🏕️\",\"Camp & territoire\",\"Un territoire se construit et se défend en RP. Aucun clan ne possède automatiquement une zone sans interaction ni développement RP.\"],[\"🤝\",\"Alliances\",\"Les alliances doivent avoir une justification RP. Les coalitions permanentes uniquement destinées à dominer les autres groupes sont interdites.\"],[\"⚔️\",\"Rivalités\",\"Une rivalité doit progresser par étapes : tensions, avertissements, négociations puis éventuellement affrontements.\"],[\"🔥\",\"Guerres de clans\",\"Une guerre doit avoir des raisons sérieuses, des enjeux identifiables et des conditions de fin. Le conflit ne doit pas devenir du PvP permanent.\"],[\"🎯\",\"Attaques & représailles\",\"Les attaques gratuites sont interdites. Chaque action hostile doit avoir un motif RP lié au conflit en cours.\"],[\"🕊️\",\"Négociations\",\"Les clans doivent laisser une place réelle aux discussions, accords, rançons, échanges de prisonniers et cessez-le-feu.\"],[\"📦\",\"Ressources du clan\",\"Les stocks, véhicules, armes et ressources du clan doivent provenir d'activités RP cohérentes et ne doivent pas être transférés abusivement entre personnages.\"],[\"🔫\",\"Armement\",\"Le niveau d'armement utilisé doit être proportionné à la situation. Une rencontre banale ne doit pas se transformer automatiquement en fusillade lourde.\"],[\"⛓️\",\"Captures & prisonniers\",\"Capturer un membre adverse doit créer une scène jouable. Les humiliations abusives, scènes interminables ou exécutions gratuites sont interdites.\"],[\"🚪\",\"Départ d'un clan\",\"Quitter un clan doit être joué proprement. Il est interdit d'utiliser des informations internes ou des biens du clan de manière HRP après son départ.\"],[\"🛠️\",\"Dissolution & inactivité\",\"Un clan durablement inactif peut perdre son territoire, ses avantages ou être dissous afin de préserver un RP vivant.\"]]}}");let active=new URLSearchParams(location.search).get("cat"),all=false;const home=document.getElementById("home"),detail=document.getElementById("detail"),cards=document.getElementById("cards"),tabs=document.getElementById("tabs"),summary=document.getElementById("summary"),list=document.getElementById("list"),search=document.getElementById("search"),expand=document.getElementById("expand"),empty=document.getElementById("empty");function buildHome(){cards.innerHTML=Object.entries(data).map(([k,c])=>'<a class="card" href="?cat='+k+'"><div class="ico">'+c.icon+'</div><h3>'+c.label+'</h3><p>'+c.desc+'</p><div class="meta"><span>'+c.items.length+' CHAPITRES</span><span class="arrow">→</span></div></a>').join("")}function render(){if(!active||!data[active]){home.style.display="block";detail.style.display="none";buildHome();return}home.style.display="none";detail.style.display="block";const c=data[active];document.getElementById("bigIcon").textContent=c.icon;document.getElementById("title").textContent="Règlement "+c.label;document.getElementById("desc").textContent=c.desc;document.getElementById("count").textContent=c.items.length+" chapitres • Dernière mise à jour : 29 août 2026";tabs.innerHTML=Object.entries(data).map(([k,v])=>'<button class="tab '+(k===active?'active':'')+'" data-cat="'+k+'">'+v.icon+' '+v.label+'</button>').join("");tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{active=b.dataset.cat;history.replaceState(null,"","?cat="+active);search.value="";all=false;render()});filter()}function filter(){const c=data[active],q=search.value.toLowerCase().trim();const items=c.items.filter(x=>!q||[x[1],x[2]].join(" ").toLowerCase().includes(q));summary.innerHTML=items.map((x,i)=>'<a class="sum '+(i===0?'active':'')+'" href="#r'+i+'"><span>'+x[0]+'</span><b>'+x[1]+'</b></a>').join("");list.innerHTML=items.map((x,i)=>'<article class="item '+(all||i===0?'open':'')+'" id="r'+i+'"><div class="head"><span class="ico">'+x[0]+'</span><strong>'+x[1]+'</strong><span class="chev">⌄</span></div><div class="body"><p>'+x[2]+'</p></div></article>').join("");list.querySelectorAll(".head").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));empty.style.display=items.length?"none":"block";expand.textContent=all?"Tout réduire":"Tout déplier"}search.oninput=filter;expand.onclick=()=>{all=!all;filter()};render();
</script></body></html>
